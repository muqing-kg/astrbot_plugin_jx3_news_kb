name: astrbot_plugin_jx3_news_kb
display_name: 剑网3新闻公告知识库
short_desc: 抓取剑网3官方公告，提供问答、逐日到期提醒与 WebUI 管理。
desc: |
  抓取 JX3API 官方公告与新闻到本地知识库，提供：

  - 混合检索问答：全文（FTS5）+ 向量召回 + 可选 Reranker，回答逐句核对公告原文并自动标注来源，无依据的数字与编造名称会被剔除。
  - 活动到期提醒：逐日倒计时（可提前 0–7 天）、周一/周四维护日截止改前一晚提醒、截止前临期加推；活动/道具措辞自动区分，同日多条合并推送。
  - WebUI 管理页：公告检索与详情、彻底删除（含指纹墓碑）、倒计时提醒管理、抓取日志，支持亮暗主题。
