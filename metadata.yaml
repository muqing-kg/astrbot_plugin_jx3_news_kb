desc: "实时推送 + 定时同步两条路抓取剑网3官方公告：推送到达即入库并按 url 去重，随后补正文；常规同步默认每 60 分钟核对一次，每天 03:00 全量核对并补齐缺少正文的公告，入库按内容指纹判重、保留修订历史、删除留墓碑防补抓。活动到期提醒：从公告正文抽取活动名称与截止时间，逐日倒计时（可提前 0-7 天）、周一/周四维护日截止改前一晚提醒、截止前临期加推，活动/道具措辞自动区分，同会话多条合并推送。WebUI 管理页：公告列表与详情、活动与待发提醒、彻底删除、抓取与推送日志，支持亮暗主题。"
