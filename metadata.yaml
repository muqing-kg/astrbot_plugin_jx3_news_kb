short_desc: 抓取剑网3官方公告，抽取活动与截止时间，逐日推送到期提醒。
desc: "每天 03:00 全量抓取剑网3官方公告：按 url 与内容指纹判重入库，补齐缺少正文的公告，保留修订历史，删除留墓碑防补抓；当天已完成则不会因重载重复拉取。活动到期提醒：从公告正文抽取活动名称与截止时间，逐日倒计时（可提前 0-7 天）、周一/周四维护日截止改前一晚提醒、截止前临期加推，活动/道具措辞自动区分，同会话多条合并推送。WebUI 管理页：公告列表与详情、进行中与长期活动汇总、彻底删除、同步日志，支持亮暗主题。"
